services:
  postgres:
    image: postgres:latest
    restart: unless-stopped
    container_name: postgres
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    volumes:
      - ./data:/var/lib/postgresql
    healthcheck:
      test: pg_isready -U postgres -d postgres -h localhost -p 5432
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
  app:
    build: .
    container_name: hangman_app
    ports:
      - 8000:8000
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
    depends_on:
      postgres:
        condition: service_healthy
